<!doctype html>
<html lang="en" class="h-full antialiased font-sans" data-theme="system">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student complaint management with role based workflows, realtime updates and evidence." />
  <meta name="author" content="Varshit Tyagi, Mohini Teotia" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12121f" />
  <title>ProctorAI</title>
  <script>
    try {
      var stored = localStorage.getItem("pai_theme");
      var mode = stored === "dark" || stored === "light" ? stored : "system";
      var root = document.documentElement;
      root.dataset.theme = mode;
      if (mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) root.classList.add("dark");
    } catch (error) {}
  </script>
</head>

<body class="min-h-full flex flex-col">
  <div id="root" class="flex min-h-full flex-1 flex-col"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
