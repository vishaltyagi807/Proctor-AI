<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset="0.52" stop-color="#5851f8"/>
      <stop offset="1" stop-color="#c35dd9"/>
    </linearGradient>
    <radialGradient id="glow" cx="230" cy="170" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cbbf9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3cbbf9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="860" cy="900" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8be0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8be0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="512" y1="0" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="512" y1="196" x2="512" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6ff"/>
    </linearGradient>
    <linearGradient id="eye" x1="362" y1="430" x2="662" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cbbf9"/>
      <stop offset="0.45" stop-color="#5851f8"/>
      <stop offset="1" stop-color="#c35dd9"/>
    </linearGradient>
    <linearGradient id="pupil" x1="476" y1="466" x2="548" y2="538" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3321a8"/>
      <stop offset="1" stop-color="#5851f8"/>
    </linearGradient>
    <filter id="lift" x="120" y="120" width="784" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26" result="blur"/>
      <feFlood flood-color="#1b0f5c" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>
  <g>
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#ember)"/>
    <rect width="1024" height="560" fill="url(#sheen)"/>
  </g>
</svg>
