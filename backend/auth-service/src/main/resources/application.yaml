server:
  port: ${AUTH_SERVER_PORT:7051}

spring:
  application:
    name: AUTH-SERVICE
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/proctor}
    username: ${AUTHENTICATOR_USER_NAME}
    password: ${AUTHENTICATOR_USER_PASSWORD}
    pool:
      initial-size: 2
      max-size: 10

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-expires-in: ${JWT_ACCESS_EXPIRE_IN_SEC:900}
    refresh-token-expires-in: ${JWT_REFRESH_EXPIRE_IN_SEC:2592000}
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS}
    public-paths:
      - /auth/login
      - /auth/logout
      - /auth/refresh
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
