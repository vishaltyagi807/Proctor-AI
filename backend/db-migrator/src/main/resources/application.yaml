spring:
  application:
    name: DB-MIGRATOR
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: ${MIGRATION_DATABASE_URL:jdbc:postgresql://localhost:5432/proctor}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 2
  flyway:
    baseline-on-migrate: true
    baseline-version: "1.11"
    baseline-description: Existing schema created by the init scripts
    connect-retries: 30
    connect-retries-interval: 2
    validate-migration-naming: true
    placeholders:
      authenticator_password: ${AUTHENTICATOR_USER_PASSWORD}
      app_password: ${APP_USER_PASSWORD}
      admin_password: ${ADMIN_PASSWORD}
