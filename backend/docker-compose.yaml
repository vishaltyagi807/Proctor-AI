name: proctor-backend

x-java-dev: &java-dev
  JAVA_TOOL_OPTIONS: >-
    -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k -Xms64m -Xmx512m
    -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/tmp/service.jsa

x-backend-env: &backend-env
  <<: *java-dev
  APP_USER_NAME: ${APP_USER_NAME}
  APP_USER_PASSWORD: ${APP_USER_PASSWORD}
  R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_ACCESS_EXPIRE_IN_SEC: ${JWT_ACCESS_EXPIRE_IN_SEC:-900}
  JWT_REFRESH_EXPIRE_IN_SEC: ${JWT_REFRESH_EXPIRE_IN_SEC:-2592000}
  APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka

x-backend-build: &backend-build
  context: .
  target: service

x-backend: &backend
  restart: unless-stopped
  depends_on: &backend-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    discovery-server:
      condition: service_healthy
  healthcheck: &backend-health
    test: [ "CMD-SHELL", "curl -fsS http://localhost:$$SERVER_PORT/actuator/health > /dev/null" ]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 60s
    start_interval: 2s

services:

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${AUTHENTICATOR_USER_NAME} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
      start_interval: 1s
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
      start_interval: 1s
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-9200}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9201}:9001"

  minio-init:
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::'$$S3_BUCKET'/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::'$$S3_BUCKET'\"]}]}' > /tmp/policy.json &&
      (mc admin policy create local proctor-app-policy /tmp/policy.json || mc admin policy create local proctor-app-policy /tmp/policy.json) &&
      (mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY || true) &&
      mc admin policy attach local proctor-app-policy --user $$S3_ACCESS_KEY
      "

  discovery-server:
    image: proctor/discovery-server:dev
    build:
      <<: *backend-build
      args:
        SERVICE: discovery-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      <<: *java-dev
      SERVER_PORT: "8761"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      <<: *backend-health
      start_period: 40s
    ports:
      - "127.0.0.1:${DISCOVERY_SERVER_PORT:-8761}:8761"

  api-gateway:
    <<: *backend
    image: proctor/api-gateway:dev
    build:
      <<: *backend-build
      args:
        SERVICE: api-gateway
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *java-dev
      SERVER_PORT: "7050"
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    ports:
      - "127.0.0.1:${GATEWAY_SERVER_PORT:-7050}:7050"

  auth-service:
    <<: *backend
    image: proctor/auth-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: auth-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7051"
      AUTHENTICATOR_USER_NAME: ${AUTHENTICATOR_USER_NAME}
      AUTHENTICATOR_USER_PASSWORD: ${AUTHENTICATOR_USER_PASSWORD}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}

  user-service:
    <<: *backend
    image: proctor/user-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: user-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7052"
      APP_STORAGE_DIR: /data
    volumes:
      - user_storage:/data

  department-service:
    <<: *backend
    image: proctor/department-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: department-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7053"

  role-service:
    <<: *backend
    image: proctor/role-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: role-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7054"

  complaint-service:
    <<: *backend
    image: proctor/complaint-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: complaint-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7055"

  storage-service:
    <<: *backend
    image: proctor/storage-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: storage-service
    depends_on:
      <<: *backend-depends
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      SERVER_PORT: "7056"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9200}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

  custom-field-service:
    <<: *backend
    image: proctor/custom-field-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: custom-field-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7057"

  notification-service:
    <<: *backend
    image: proctor/notification-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: notification-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7058"
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY}

  face-service:
    <<: *backend
    image: proctor/face-service:dev
    build:
      context: .
      target: face-service
      args:
        SERVICE: face-service
    environment:
      <<: *backend-env
      JAVA_TOOL_OPTIONS: >-
        -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k -Xms64m -Xmx1g
        -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/tmp/service.jsa
      SERVER_PORT: "7059"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      APP_STORAGE_DIR: /data
      FACE_DETECTION_INPUT_SIZE: ${FACE_DETECTION_INPUT_SIZE:-640}
      FACE_DETECTION_SCORE_THRESHOLD: ${FACE_DETECTION_SCORE_THRESHOLD:-0.5}
      FACE_DETECTION_NMS_THRESHOLD: ${FACE_DETECTION_NMS_THRESHOLD:-0.4}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.75}
      FACE_MAX_IMAGE_BYTES: ${FACE_MAX_IMAGE_BYTES:-8388608}
      FACE_EMBEDDING_DIMENSIONS: ${FACE_EMBEDDING_DIMENSIONS:-512}
    volumes:
      - face_storage:/data

  monitor-service:
    <<: *backend
    image: proctor/monitor-service:dev
    build:
      <<: *backend-build
      args:
        SERVICE: monitor-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7060"
    volumes:
      - monitor_probe:/docker-volumes

  frontend:
    image: proctor/frontend:dev
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    environment:
      API_URL: http://api-gateway:7050
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
      - ../frontend/tsconfig.json:/app/tsconfig.json:ro
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  user_storage:
  face_storage:
  monitor_probe:
