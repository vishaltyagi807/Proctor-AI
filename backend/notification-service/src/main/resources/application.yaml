server:
  port: ${NOTIFICATION_SERVER_PORT:7058}

spring:
  application:
    name: NOTIFICATION-SERVICE
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/proctor}
    username: ${APP_USER_NAME}
    password: ${APP_USER_PASSWORD}
    pool:
      initial-size: 3
      max-size: 15
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-expires-in: ${JWT_ACCESS_EXPIRE_IN_SEC:900}
    refresh-token-expires-in: ${JWT_REFRESH_EXPIRE_IN_SEC:2592000}
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS}
    public-paths:
      - /notifications/panel/**
  notifications:
    secret-key: ${NOTIFICATION_SECRET_KEY}
    consumer-name: ${NOTIFICATION_CONSUMER_NAME:}
    batch-size: 20
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    fcm:
      token-url: ${FCM_TOKEN_URL:https://oauth2.googleapis.com/token}
      send-url: ${FCM_SEND_URL:https://fcm.googleapis.com/v1/projects/{project}/messages:send}

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
