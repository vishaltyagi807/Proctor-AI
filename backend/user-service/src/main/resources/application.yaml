server:
  port: ${USER_SERVER_PORT:7052}

spring:
  application:
    name: USER-SERVICE
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/proctor}
    username: ${APP_USER_NAME}
    password: ${APP_USER_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
  codec:
    max-in-memory-size: 2MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  import:
    max-rows: ${APP_IMPORT_MAX_ROWS:100000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-expires-in: ${JWT_ACCESS_EXPIRE_IN_SEC:900}
    refresh-token-expires-in: ${JWT_REFRESH_EXPIRE_IN_SEC:2592000}
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app.storage:
  dir: ${APP_STORAGE_DIR:./storage}
  max-bytes: ${APP_STORAGE_MAX_BYTES:10485760}
  temp-ttl: ${APP_STORAGE_TEMP_TTL:30m}
  sweep-interval: ${APP_STORAGE_SWEEP_INTERVAL:15m}

spring.webflux.multipart:
  max-disk-usage-per-part: 200MB
  max-parts: 10
