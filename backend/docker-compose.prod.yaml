name: proctor-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-java-prod: &java-prod
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseG1GC -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
    -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom

x-backend-env: &backend-env
  <<: *java-prod
  APP_USER_NAME: ${APP_USER_NAME:?APP_USER_NAME is required}
  APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
  R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
  JWT_ACCESS_EXPIRE_IN_SEC: ${JWT_ACCESS_EXPIRE_IN_SEC:-900}
  JWT_REFRESH_EXPIRE_IN_SEC: ${JWT_REFRESH_EXPIRE_IN_SEC:-2592000}
  APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?APP_ALLOWED_ORIGINS is required}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${DISCOVERY_USERNAME:?DISCOVERY_USERNAME is required}:${DISCOVERY_PASSWORD:?DISCOVERY_PASSWORD is required}@discovery-server:8761/eureka

x-backend-build: &backend-build
  context: .
  target: service
  args: &backend-build-args
    GRADLE_FLAGS: --no-build-cache

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777,size=256m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend: &backend
  <<: *hardening
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *logging
  depends_on: &backend-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    discovery-server:
      condition: service_healthy
  healthcheck: &backend-health
    test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$SERVER_PORT/actuator/health" ]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 120s
    start_interval: 3s
  deploy: &backend-deploy
    resources:
      limits:
        memory: 768m

services:

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTHENTICATOR_USER_NAME: ${AUTHENTICATOR_USER_NAME:?AUTHENTICATOR_USER_NAME is required}
      AUTHENTICATOR_USER_PASSWORD: ${AUTHENTICATOR_USER_PASSWORD:?AUTHENTICATOR_USER_PASSWORD is required}
      APP_USER_NAME: ${APP_USER_NAME:?APP_USER_NAME is required}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${AUTHENTICATOR_USER_NAME} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    logging: *logging
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 2s
    volumes:
      - minio_data:/data
    ports:
      - "${S3_PORT:-9200}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9201}:9001"

  minio-init:
    image: quay.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::'$$S3_BUCKET'/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::'$$S3_BUCKET'\"]}]}' > /tmp/policy.json &&
      (mc admin policy create local proctor-app-policy /tmp/policy.json || mc admin policy create local proctor-app-policy /tmp/policy.json) &&
      (mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY || true) &&
      mc admin policy attach local proctor-app-policy --user $$S3_ACCESS_KEY
      "

  discovery-server:
    <<: *hardening
    image: proctor/discovery-server:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: discovery-server
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *java-prod
      SERVER_PORT: "8761"
      DISCOVERY_USERNAME: ${DISCOVERY_USERNAME:?DISCOVERY_USERNAME is required}
      DISCOVERY_PASSWORD: ${DISCOVERY_PASSWORD:?DISCOVERY_PASSWORD is required}
      DISCOVERY_DASHBOARD_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      <<: *backend-health
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512m

  api-gateway:
    <<: *backend
    image: proctor/api-gateway:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: api-gateway
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *java-prod
      SERVER_PORT: "7050"
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${DISCOVERY_USERNAME:?DISCOVERY_USERNAME is required}:${DISCOVERY_PASSWORD:?DISCOVERY_PASSWORD is required}@discovery-server:8761/eureka

  auth-service:
    <<: *backend
    image: proctor/auth-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: auth-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7051"
      AUTHENTICATOR_USER_NAME: ${AUTHENTICATOR_USER_NAME}
      AUTHENTICATOR_USER_PASSWORD: ${AUTHENTICATOR_USER_PASSWORD}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}

  user-service:
    <<: *backend
    image: proctor/user-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: user-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7052"
      APP_STORAGE_DIR: /data
    volumes:
      - user_storage:/data

  department-service:
    <<: *backend
    image: proctor/department-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: department-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7053"

  role-service:
    <<: *backend
    image: proctor/role-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: role-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7054"

  complaint-service:
    <<: *backend
    image: proctor/complaint-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: complaint-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7055"

  storage-service:
    <<: *backend
    image: proctor/storage-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: storage-service
    depends_on:
      <<: *backend-depends
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      SERVER_PORT: "7056"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

  custom-field-service:
    <<: *backend
    image: proctor/custom-field-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: custom-field-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7057"

  notification-service:
    <<: *backend
    image: proctor/notification-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: notification-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7058"
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:?NOTIFICATION_SECRET_KEY is required}

  face-service:
    <<: *backend
    image: proctor/face-service:${APP_VERSION:-latest}
    build:
      context: .
      target: face-service
      args:
        <<: *backend-build-args
        SERVICE: face-service
    healthcheck:
      <<: *backend-health
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7059/actuator/health" ]
    environment:
      <<: *backend-env
      SERVER_PORT: "7059"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      APP_STORAGE_DIR: /data
      FACE_DETECTION_INPUT_SIZE: ${FACE_DETECTION_INPUT_SIZE:-640}
      FACE_DETECTION_SCORE_THRESHOLD: ${FACE_DETECTION_SCORE_THRESHOLD:-0.5}
      FACE_DETECTION_NMS_THRESHOLD: ${FACE_DETECTION_NMS_THRESHOLD:-0.4}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.75}
      FACE_MAX_IMAGE_BYTES: ${FACE_MAX_IMAGE_BYTES:-8388608}
      FACE_EMBEDDING_DIMENSIONS: ${FACE_EMBEDDING_DIMENSIONS:-512}
    volumes:
      - face_storage:/data
    deploy:
      resources:
        limits:
          memory: 2560m

  monitor-service:
    <<: *backend
    image: proctor/monitor-service:${APP_VERSION:-latest}
    build:
      <<: *backend-build
      args:
        <<: *backend-build-args
        SERVICE: monitor-service
    environment:
      <<: *backend-env
      SERVER_PORT: "7060"
    volumes:
      - monitor_probe:/docker-volumes
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    image: proctor/frontend:${APP_VERSION:-latest}
    build:
      context: ../frontend
      target: prod
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  user_storage:
  face_storage:
  monitor_probe:
